<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta property="og:type" content="website">
<meta property="og:site_name" content="주머니">

<meta property="og:description" content="지나던 사람이 주워 읽고, 대화를 신청해요.">

<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="이 자리에 누군가 편지를 두고 갔어요">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="이 자리에 누군가 편지를 두고 갔어요">
<meta name="twitter:description" content="지나던 사람이 주워 읽고, 대화를 신청해요.">
<meta name="twitter:image" content="https://haeun05.github.io/jumeoni/og-map.png">
<meta name="description" content="장소에 편지를 남기고, 그곳을 지나는 낯선 사람이 줍는 지도.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --paper: #f5efe2;
    --letter: #fbf7ec;
    --ink: #3d3529;
    --ink-soft: #8a7f6d;
    --red: #b0563c;
    --blue: #3a5a8c;
    --line: #ddd2bd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  header { text-align: center; padding: 18px 16px 12px; flex-shrink: 0; }
  .brand {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 14px; letter-spacing: 0.35em; color: var(--ink-soft);
    cursor: pointer; user-select: none;
  }
  .room-name { font-size: 10.5px; letter-spacing: 0.25em; color: var(--red); margin-top: 5px; font-weight: 300; }
  .beta {
    padding: 7px 14px; text-align: center;
    font-size: 11.5px; color: var(--ink-soft); font-weight: 300;
    border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line);
    background: rgba(255,255,255,0.5); flex-shrink: 0; line-height: 1.7;
  }
  .beta b { color: var(--red); font-weight: 400; }
  #map { flex: 1; }
  .leaflet-container { font-family: 'Noto Serif KR', serif; background: #ece5d4; }

  /* 팝업 편지 */
  .leaflet-popup-content-wrapper {
    background: var(--letter); color: var(--ink);
    border-radius: 3px; border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(61,53,41,0.25);
  }
  .leaflet-popup-content { margin: 18px 18px 14px; width: 240px !important; }
  .leaflet-popup-tip { background: var(--letter); }
  .pop-pen { font-family: 'Nanum Myeongjo', serif; font-size: 15px; font-weight: 700; }
  .pop-place { font-size: 11.5px; color: var(--ink-soft); font-weight: 300; margin-top: 2px; }
  .pop-body {
    margin-top: 12px;
    font-family: 'Nanum Pen Script', cursive;
    font-size: 19px; line-height: 1.75;
    white-space: pre-wrap; font-weight: 400;
    max-height: 190px; overflow-y: auto;
  }
  .pop-actions { margin-top: 14px; }
  .pop-btn {
    display: block; width: 100%;
    font-family: 'Noto Serif KR', serif; font-size: 12.5px; letter-spacing: 0.1em;
    padding: 9px; cursor: pointer; border-radius: 2px; text-align: center;
    border: 1px solid var(--ink); background: var(--ink); color: var(--letter);
    transition: background .3s;
  }
  .pop-btn:hover { background: var(--red); border-color: var(--red); }
  .pop-note { margin-top: 9px; font-size: 11px; color: var(--ink-soft); font-weight: 300; line-height: 1.8; text-align: center; }
  .pop-note b { color: var(--red); font-weight: 400; }

  /* 아래 안내바 + 쓰기 패널 */
  .bottombar {
    flex-shrink: 0; padding: 12px 16px;
    background: var(--paper); border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; justify-content: center;
  }
  .bar-btn {
    font-family: 'Noto Serif KR', serif; font-size: 13.5px; letter-spacing: 0.04em;
    white-space: nowrap; flex-shrink: 0;
    padding: 11px 16px; cursor: pointer; border-radius: 2px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--letter);
    transition: background .3s;
  }
  .bar-btn:hover { background: var(--red); border-color: var(--red); }
  .bar-btn.ghost { background: transparent; color: var(--ink); }
  .bar-btn.ghost:hover { color: var(--red); border-color: var(--red); }
  .bar-btn.armed { background: var(--red); border-color: var(--red); color: var(--letter); }
  .bar-hint { font-size: 12px; color: var(--ink-soft); font-weight: 300; }

  .write-panel {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
    width: min(420px, calc(100vw - 32px));
    background: var(--letter); border: 1px solid var(--line); border-radius: 3px;
    box-shadow: 0 20px 50px rgba(61,53,41,0.3);
    padding: 20px; z-index: 1200;
  }
  .write-panel h3 { font-family: 'Nanum Myeongjo', serif; font-size: 16px; margin-bottom: 4px; }
  .write-panel .wp-place { font-size: 12px; color: var(--ink-soft); font-weight: 300; margin-bottom: 12px; }
  .write-panel textarea {
    width: 100%; min-height: 96px;
    font-family: 'Noto Serif KR', serif; font-size: 14px; color: var(--ink);
    line-height: 2; border: 1px solid var(--line); border-radius: 2px;
    background: rgba(255,255,255,0.6); padding: 12px; resize: none; outline: none;
  }
  .write-panel textarea:focus { border-color: var(--red); }
  .write-panel .wp-row { display: flex; gap: 8px; margin-top: 12px; }
  .write-panel .wp-row .pop-btn { flex: 1; }
  .write-panel .pop-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .toast {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    background: var(--ink); color: var(--letter);
    font-size: 12.5px; letter-spacing: 0.08em; font-weight: 300;
    padding: 10px 18px; border-radius: 2px; z-index: 1300;
    box-shadow: 0 10px 26px rgba(61,53,41,0.35);
    opacity: 0; transition: opacity .4s; pointer-events: none;
    max-width: calc(100vw - 32px); text-align: center; line-height: 1.8;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="theme.css">
<script src="letters.js"></script>
<script src="icons.js" defer></script>
<script src="ui.js" defer></script>
</head>
<body>
<header>
  <div class="brand" onclick="location.href='index.html'">주 머 니</div>
  <div class="room-name">편지 지도</div>
</header>
<div class="beta">체험판 — 지금 남기는 편지는 <b>이 기기에만</b> 보여요 · 우체국이 개국하면 모두의 지도에 함께 떠요</div>
<div id="map"></div>
<div class="bottombar">
  <button class="bar-btn" id="drop-btn" onclick="armDrop()">✉️ 편지 남기기</button>
  <button class="bar-btn ghost" onclick="goNear()">📍 내 근처</button>
  <button class="bar-btn ghost" onclick="location.href='post.html'">📮 우체국</button>
  <span class="bar-hint" id="bar-hint"></span>
</div>

<div class="write-panel hidden" id="write-panel">
  <h3>이 자리에 편지를 남겨요</h3>
  <div class="wp-place" id="wp-place"></div>
  <textarea id="wp-text" placeholder="이곳을 지나는 낯선 누군가에게…"></textarea>
  <div class="wp-row">
    <button class="pop-btn" onclick="dropLetter()">놓아두기</button>
    <button class="pop-btn ghost" onclick="cancelDrop()">그만두기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // 씨앗 편지: 개국 전에도 지도가 비어 보이지 않도록, 견본 편지 몇 통을 놓아둔다.
  const SEED = window.JLetters.seed;

  const $ = id => document.getElementById(id);
  const myLetters = JSON.parse(localStorage.getItem('jumeoni_map_letters') || '[]');
  const pen = localStorage.getItem('jumeoni_pen') || '';

  const map = L.map('map', { zoomControl: true }).setView([36.5, 127.8], 7);

  // 지도도 테마를 따라간다 ({r}은 레티나에서 @2x 타일을 자동 선택)
  const TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
  const tileUrl = mode => `https://{s}.basemaps.cartocdn.com/rastertiles/${mode === 'dark' ? 'dark_all' : 'voyager'}/{z}/{x}/{y}{r}.png`;
  // ui.js보다 먼저 실행되므로 저장된 선택을 직접 읽어 첫 타일부터 맞춘다
  const isDark = () => (document.documentElement.getAttribute('data-theme')
    || localStorage.getItem('jumeoni_theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';

  let tiles = L.tileLayer(tileUrl(isDark() ? 'dark' : 'light'), {
    maxZoom: 20, subdomains: 'abcd', attribution: TILE_ATTR
  }).addTo(map);

  document.addEventListener('jumeoni:theme', e => {
    const next = L.tileLayer(tileUrl(e.detail.mode), { maxZoom: 20, subdomains: 'abcd', attribution: TILE_ATTR });
    next.addTo(map);
    next.once('load', () => map.removeLayer(tiles));
    setTimeout(() => { if (map.hasLayer(tiles)) map.removeLayer(tiles); }, 1200);
    tiles = next;
  });

  function letterPopup(d, mine) {
    const actions = mine
      ? `<div class="pop-note">내가 남긴 편지예요 · 개국하면 모두의 지도에 떠요</div>`
      : `<div class="pop-actions"><button class="pop-btn" onclick="askTalk('${d.pen.replace(/'/g, "\\'")}')">이 편지가 마음에 들어요 — 대화 신청</button></div>
         <div class="pop-note">개국하면 <b>${d.pen}</b> 님의 우편함으로 배달돼요</div>`;
    return `<div class="pop-pen">${d.pen}</div>
      <div class="pop-place">${d.place || '지도 위 어딘가'}</div>
      <div class="pop-body">${d.body.replace(/</g,'&lt;')}</div>${actions}`;
  }

  function addMarker(d, mine) {
    const m = L.circleMarker([d.lat, d.lng], {
      radius: 9,
      color: mine ? '#3a5a8c' : '#b0563c',
      weight: 2,
      fillColor: mine ? '#6d8cbb' : '#c97a5f',
      fillOpacity: 0.85
    }).addTo(map);
    m.bindPopup(letterPopup(d, mine), { maxWidth: 280 });
    return m;
  }

  SEED.forEach(d => addMarker(d, false));
  myLetters.forEach(d => addMarker(d, true));

  function toast(msg) {
    const t = $('toast');
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function askTalk(who) {
    map.closePopup();
    const likes = JSON.parse(localStorage.getItem('jumeoni_likes') || '[]');
    if (!likes.includes(who)) { likes.push(who); localStorage.setItem('jumeoni_likes', JSON.stringify(likes)); }
    toast(`마음을 보관했어요 🕊️<br>우체국이 개국하면 ${who} 님에게 첫 편지가 배달돼요`);
  }

  // 편지 남기기
  let armed = false;
  let pendingLatLng = null;

  function armDrop() {
    armed = !armed;
    $('drop-btn').classList.toggle('armed', armed);
    $('bar-hint').textContent = armed ? '지도에서 편지를 놓을 자리를 눌러주세요' : '';
    if (!armed) hidePanel();
  }

  // 좌표만으로는 어디인지 알 수 없어서, 지명을 물어본다 (실패해도 좌표로 진행)
  let pendingPlace = '';
  async function lookupPlace(latlng) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16` +
                  `&lat=${latlng.lat}&lon=${latlng.lng}&accept-language=ko`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!res.ok) return '';
      const a = (await res.json()).address || {};
      const parts = [
        a.city || a.town || a.county || a.province || a.state,
        a.borough || a.city_district || a.suburb || a.village,
        a.neighbourhood || a.quarter || a.road
      ].filter(Boolean);
      return [...new Set(parts)].slice(0, 2).join(' ');
    } catch { return ''; }
  }

  map.on('click', e => {
    if (!armed) return;
    pendingLatLng = e.latlng;
    pendingPlace = '';
    $('wp-place').textContent = `위도 ${e.latlng.lat.toFixed(4)} · 경도 ${e.latlng.lng.toFixed(4)}`;
    $('write-panel').classList.remove('hidden');
    $('wp-text').focus();
    lookupPlace(e.latlng).then(name => {
      if (!name || !pendingLatLng) return;
      pendingPlace = name;
      $('wp-place').textContent = `📍 ${name}`;
    });
  });

  // 내 근처에 놓인 편지 찾아보기
  function goNear() {
    if (!navigator.geolocation) { toast('이 브라우저에서는 위치를 쓸 수 없어요'); return; }
    toast('가까운 편지를 찾는 중이에요…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const me = L.latLng(pos.coords.latitude, pos.coords.longitude);
        map.setView(me, 13);
        L.circleMarker(me, { radius: 7, color: '#3a5a8c', weight: 2, fillColor: '#8ea8d8', fillOpacity: 0.9 })
          .addTo(map).bindPopup('<div class="pop-pen">지금 당신이 선 자리</div>').openPopup();
        const all = [...SEED, ...myLetters];
        let near = null, best = Infinity;
        all.forEach(d => {
          const km = me.distanceTo(L.latLng(d.lat, d.lng)) / 1000;
          if (km < best) { best = km; near = d; }
        });
        toast(near
          ? `가장 가까운 편지는 <b>${near.place || near.pen}</b> — 약 ${best < 1 ? Math.round(best * 1000) + 'm' : Math.round(best) + 'km'} 떨어져 있어요`
          : '아직 근처에 놓인 편지가 없어요');
      },
      () => toast('위치를 확인하지 못했어요 · 지도를 직접 움직여보세요')
    );
  }

  function hidePanel() {
    $('write-panel').classList.add('hidden');
    $('wp-text').value = '';
    pendingLatLng = null;
  }

  function cancelDrop() {
    hidePanel();
    armed = false;
    $('drop-btn').classList.remove('armed');
    $('bar-hint').textContent = '';
  }

  function dropLetter() {
    const body = $('wp-text').value.trim();
    if (!body || !pendingLatLng) { $('wp-text').focus(); return; }
    const d = { lat: pendingLatLng.lat, lng: pendingLatLng.lng, pen: pen || '이름 없는 발신인', place: pendingPlace, body };
    myLetters.push(d);
    localStorage.setItem('jumeoni_map_letters', JSON.stringify(myLetters));
    addMarker(d, true).openPopup();
    cancelDrop();
    toast('편지를 놓아뒀어요 · 개국하면 모두의 지도에 떠요');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
