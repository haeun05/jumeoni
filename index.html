<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="이름도 얼굴도 모르는 사람들이 써둔 편지. 마음에 닿는 편지에 답장하면 둘의 이야기가 시작돼요.">

<script>
  // 예전 시 카드 링크는 시 방으로 넘긴다
  if (/^#(c|z)=/.test(location.hash)) location.replace('si.html' + location.hash);

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff9f2; --ink:#52463d; --ink-soft:#b3a496; --accent:#ee8b6c; --line:#f3e6d8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Serif KR',serif; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
  }
  main { width:100%; max-width:520px; padding:0 20px 40px; flex:1; }
  header { text-align:center; padding-top:24px; }
  .brand { font-family:'Nanum Myeongjo',serif; font-size:15px; letter-spacing:.35em; color:var(--ink-soft); }
  .room-name { font-size:11px; letter-spacing:.25em; color:var(--accent); margin-top:6px; font-weight:300; }
  .hidden { display:none !important; }

  .lead { text-align:center; margin:34px 0 22px; }
  .lead h1 { font-family:'Nanum Myeongjo',serif; font-size:25px; font-weight:700; line-height:1.5; }
  .lead p { margin-top:12px; color:var(--ink-soft); font-size:14px; font-weight:300; line-height:1.95; }

  .wall-top { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
  .wall-top .count { font-size:12px; color:var(--ink-soft); font-weight:300; margin-right:auto; }
  .mini {
    font-family:'Noto Serif KR',serif; font-size:12.5px; padding:7px 13px;
    border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--ink-soft); cursor:pointer;
  }

  /* 편지 카드 */
  .lt {
    padding:22px 20px; margin-bottom:14px;
    background:#fff; border:1px solid var(--line); border-radius:20px;
  }
  .lt .head { display:flex; align-items:baseline; gap:9px; }
  .lt .pen { font-family:'Nanum Myeongjo',serif; font-size:16.5px; font-weight:700; }
  .lt .place { font-size:11.5px; color:var(--ink-soft); font-weight:300; }
  .lt .mine-tag {
    margin-left:auto; font-size:10.5px; color:var(--accent);
    border:1px solid var(--accent); border-radius:999px; padding:3px 9px;
  }
  .lt .body {
    margin-top:13px; font-family:'Nanum Pen Script',cursive;
    font-size:20px; line-height:1.72; white-space:pre-wrap;
  }
  .lt .body.clip { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .lt .more { margin-top:8px; font-size:12px; color:var(--accent); cursor:pointer; }
  .lt .act { margin-top:16px; display:flex; gap:8px; }
  .lt .act button {
    flex:1; font-family:'Noto Serif KR',serif; font-size:13px; font-weight:600;
    padding:11px; border-radius:999px; border:none; cursor:pointer;
    background:var(--accent); color:#fff;
  }
  .lt .act button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }

  /* 편지 쓰기 */
  label { display:block; font-size:13px; color:var(--ink-soft); margin:20px 0 8px; }
  textarea, input[type=text] {
    width:100%; font-family:'Noto Serif KR',serif; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; line-height:1.9; resize:none; outline:none;
  }
  textarea { min-height:150px; }
  .btn {
    display:block; width:100%; margin-top:26px; padding:15px;
    font-family:'Noto Serif KR',serif; font-size:15px; font-weight:700;
    color:#fff; background:var(--ink); border:none; border-radius:999px; cursor:pointer;
  }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); margin-top:12px; }
  .note { margin-top:12px; font-size:12px; color:var(--ink-soft); font-weight:300; line-height:1.9; }
  .sent { text-align:center; padding:40px 0; }
  .sent .big { font-family:'Nanum Myeongjo',serif; font-size:21px; display:block; margin-bottom:14px; }
  .sent p { color:var(--ink-soft); font-size:14px; font-weight:300; line-height:2; }
  footer { padding:22px; font-size:11px; color:var(--ink-soft); letter-spacing:.2em; font-weight:300; text-align:center; line-height:2; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="theme.css">
<script src="letters.js"></script>
<script src="icons.js" defer></script>
<script src="ui.js" defer></script>
</head>
<body>
<header>
  <div class="brand">주 머 니</div>
  <div class="room-name">편지 벽</div>
</header>
<main>

  <!-- 벽 -->
  <section id="view-wall" class="hidden">
    <div class="lead">
      <h1>낯선 사람들이<br>써둔 편지예요</h1>
      <p>받는 사람을 정하지 않고 쓴 편지들이에요<br>마음에 닿는 편지에 답장하면, 거기서 둘의 이야기가 시작돼요</p>
    </div>
    <button class="btn" onclick="go('write')">✉️ 나도 편지 한 통 걸어두기</button>
    <div class="wall-top" style="margin-top:26px">
      <span class="count" id="wall-count"></span>
      <button class="mini" onclick="location.href='map.html'">📍 지도로 보기</button>
    </div>
    <div id="wall"></div>
  </section>

  <!-- 편지 쓰기 -->
  <section id="view-write" class="hidden">
    <div class="lead">
      <h1>누군가에게</h1>
      <p>받는 사람은 정하지 않아요<br>이 편지를 읽고 마음이 움직인 사람이 답장할 거예요</p>
    </div>
    <label>편지</label>
    <textarea id="w-body" placeholder="오늘 있었던 일, 요즘 마음, 창밖 풍경 — 무엇이든 좋아요.&#10;길수록 답장이 올 확률이 높아요."></textarea>
    <label>필명</label>
    <input type="text" id="w-pen" placeholder="예) 능소화, 첫차, 밤편지">
    <label>어디에서 <span style="opacity:.6">(선택)</span></label>
    <input type="text" id="w-place" placeholder="예) 을지로 어느 골목, 종점에서 두 정거장">
    <p class="note">이름·얼굴·나이·연락처는 묻지 않아요. 편지에도 적지 마세요.</p>
    <button class="btn" onclick="postLetter()">편지 걸어두기</button>
    <button class="btn ghost" onclick="go('wall')">돌아가기</button>
  </section>

  <!-- 답장 쓰기 -->
  <section id="view-reply" class="hidden">
    <div class="lead">
      <h1 id="rp-title"></h1>
      <p>답장이 닿으면 두 사람만의 편지가 시작돼요<br>세 통이면 서로의 문답이, 일곱 통이면 만남이 열려요</p>
    </div>
    <div class="lt" style="margin-bottom:22px">
      <div class="head"><span class="pen" id="rp-pen"></span><span class="place" id="rp-place"></span></div>
      <div class="body" id="rp-body"></div>
    </div>
    <label>답장</label>
    <textarea id="rp-text" placeholder="이 편지의 어느 대목이 마음에 닿았는지부터 적어보세요."></textarea>
    <button class="btn" onclick="sendReply()">답장 보내기</button>
    <button class="btn ghost" onclick="go('wall')">돌아가기</button>
  </section>

  <!-- 보냄 -->
  <section id="view-sent" class="sent hidden">
    <span class="big" id="sent-title"></span>
    <p id="sent-body"></p>
    <button class="btn ghost" onclick="go('wall')">편지 벽으로</button>
  </section>

</main>
<footer>JUMEONI · 편지가 오가는 곳</footer>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[<>]/g, c => ({'<':'&lt;','>':'&gt;'}[c]));
  const read = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; } };

  function go(v) {
    ['wall','write','reply','sent'].forEach(x => $('view-' + x).classList.toggle('hidden', x !== v));
    if (v === 'wall') renderWall();
    window.scrollTo(0, 0);
  }

  function renderWall() {
    const list = window.JLetters.all();
    $('wall-count').textContent = `편지 ${list.length}통`;
    $('wall').innerHTML = list.map((d, i) => {
      const long = d.body.length > 90;
      return `<div class="lt">
        <div class="head">
          <span class="pen">${esc(d.pen)}</span>
          <span class="place">${esc(d.place || '어딘가에서')}</span>
          ${d.own ? '<span class="mine-tag">내가 쓴 편지</span>' : ''}
        </div>
        <div class="body${long ? ' clip' : ''}" id="b${i}">${esc(d.body)}</div>
        ${long ? `<div class="more" onclick="document.getElementById('b${i}').classList.remove('clip'); this.remove()">더 읽기</div>` : ''}
        ${d.own ? '' : `<div class="act"><button onclick="openReply(${i})">답장하기</button></div>`}
      </div>`;
    }).join('');
  }

  function postLetter() {
    const body = $('w-body').value.trim();
    const pen = $('w-pen').value.trim();
    if (!body) { $('w-body').focus(); return; }
    if (!pen) { $('w-pen').focus(); return; }
    localStorage.setItem('jumeoni_pen', pen);
    const mine = window.JLetters.mine();
    mine.push({ lat: 36.5 + (Math.random() - .5) * 2, lng: 127.8 + (Math.random() - .5) * 2,
                pen, place: $('w-place').value.trim(), body, at: Date.now() });
    localStorage.setItem('jumeoni_map_letters', JSON.stringify(mine));
    $('w-body').value = ''; $('w-place').value = '';
    $('sent-title').textContent = '편지를 걸어뒀어요';
    $('sent-body').innerHTML = '이제 이 편지는 벽에 걸려 있어요.<br>누군가 읽고 답장하면 우편함으로 알려드릴게요.<br><br>' +
      '<span style="opacity:.75">지금은 개국 준비 중이라 이 기기에만 보여요.</span>';
    go('sent');
  }

  let replyTo = null;
  function openReply(i) {
    replyTo = window.JLetters.all()[i];
    $('rp-title').textContent = `${replyTo.pen} 님에게`;
    $('rp-pen').textContent = replyTo.pen;
    $('rp-place').textContent = replyTo.place || '어딘가에서';
    $('rp-body').textContent = replyTo.body;
    $('rp-text').value = '';
    go('reply');
  }

  function sendReply() {
    const t = $('rp-text').value.trim();
    if (!t) { $('rp-text').focus(); return; }
    const th = read('jumeoni_threads', {});
    const key = replyTo.pen;
    th[key] = th[key] || { pen: key, place: replyTo.place || '', origin: replyTo.body, letters: [] };
    th[key].letters.push({ w: 'me', t, at: Date.now() });
    localStorage.setItem('jumeoni_threads', JSON.stringify(th));
    $('sent-title').textContent = '답장을 부쳤어요';
    $('sent-body').innerHTML = `${esc(key)} 님에게 내일 아침 아홉 시에 닿아요.<br>` +
      '오간 편지는 <b>우편함</b>에서 볼 수 있어요.<br><br>' +
      '<span style="opacity:.75">지금은 개국 준비 중이라 실제로 배달되지는 않아요.</span>';
    go('sent');
  }

  go('wall');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
