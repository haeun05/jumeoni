<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주머니 — 느린 것들의 집</title>
<meta name="description" content="모르는 사람과, 느린 방식으로, 시·책·편지·장소를 매개로 연결되는 낭만.">
<meta property="og:title" content="주머니">
<meta property="og:description" content="시를 건네고, 책을 나누고, 편지를 띄우는 느린 집.">
<meta name="theme-color" content="#faf6ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  // 예전 링크 호환: 시 카드 링크(#c=/#z=)가 대문으로 오면 시 방으로 넘긴다
  if (/^#(c|z)=/.test(location.hash)) location.replace('si.html' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ef;
    --ink: #3d3529;
    --ink-soft: #8a7f6d;
    --accent: #b0563c;
    --line: #e2d9c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif KR', serif;
    background: var(--paper);
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 10%, rgba(176,86,60,0.04), transparent 40%),
                      radial-gradient(circle at 80% 90%, rgba(120,110,90,0.05), transparent 40%);
  }
  main { width: 100%; max-width: 520px; padding: 0 24px 64px; flex: 1; }
  .hero { text-align: center; padding: 72px 0 40px; }
  .hero .brand {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 34px; font-weight: 700; letter-spacing: 0.5em;
    margin-left: 0.5em; /* letter-spacing 보정 */
  }
  .hero .tag {
    margin-top: 18px; color: var(--ink-soft);
    font-size: 14.5px; font-weight: 300; line-height: 2.1; letter-spacing: 0.04em;
  }
  .doors { display: flex; flex-direction: column; gap: 14px; }
  .door {
    display: flex; align-items: center; gap: 18px;
    padding: 22px 22px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--line); border-radius: 3px;
    text-decoration: none; color: var(--ink);
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .door:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 14px 34px rgba(61,53,41,0.10);
  }
  .door .ico { font-size: 30px; flex-shrink: 0; }
  .door .t { font-family: 'Nanum Myeongjo', serif; font-size: 17px; font-weight: 700; }
  .door .d { font-size: 13px; color: var(--ink-soft); font-weight: 300; margin-top: 5px; line-height: 1.8; }
  .door .badge {
    margin-left: auto; flex-shrink: 0;
    font-size: 10.5px; letter-spacing: 0.12em; font-weight: 300;
    color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 4px 10px;
  }
  .pocket-door { margin-top: 26px; text-align: center; }
  .pocket-door a {
    color: var(--ink-soft); font-size: 13.5px; font-weight: 300;
    text-decoration: none; letter-spacing: 0.1em;
    border-bottom: 1px dashed var(--line); padding-bottom: 3px;
  }
  .pocket-door a:hover { color: var(--accent); border-color: var(--accent); }
  footer {
    padding: 24px; font-size: 11px; color: var(--ink-soft);
    letter-spacing: 0.2em; font-weight: 300; text-align: center; line-height: 2;
  }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">주머니</div>
    <p class="tag">모르는 사람과, 느린 방식으로,<br>시와 책과 편지를 주고받는 집</p>
  </div>
  <nav class="doors">
    <a class="door" href="si.html">
      <span class="ico">📜</span>
      <span><span class="t">건네는 시</span><span class="d" style="display:block">시 한 편을 카드로 만들어, 링크와 QR로 건네요</span></span>
    </a>
    <a class="door" href="chaek.html">
      <span class="ico">📚</span>
      <span><span class="t">느린 책 교환</span><span class="d" style="display:block">책 한 권과, 다 읽은 뒤에야 열리는 봉인 편지</span></span>
    </a>
    <a class="door" href="post.html">
      <span class="ico">📮</span>
      <span><span class="t">편지 우체국</span><span class="d" style="display:block">이름도 얼굴도 모른 채, 필명으로만 오가는 편지</span></span>
      <span class="badge">개국 준비 중</span>
    </a>
    <a class="door" href="map.html">
      <span class="ico">🗺️</span>
      <span><span class="t">편지 지도</span><span class="d" style="display:block">장소에 편지를 남기면, 지나던 사람이 주워요</span></span>
    </a>
  </nav>
  <div class="pocket-door"><a href="pocket.html">🧺 내 주머니 열어보기 — 건넨 것과 주운 것들</a></div>
</main>
<footer>JUMEONI · A HOUSE OF SLOW THINGS</footer>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
